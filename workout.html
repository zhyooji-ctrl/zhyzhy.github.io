<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>recomp · tracker</title>
    <style>
        :root {
            --bg: #fafafa;
            --surface: #ffffff;
            --border: #e8e8e8;
            --text: #1a1a1a;
            --text-muted: #999;
            --accent: #000;
            --green: #2e7d32;
            --blue: #1565c0;
            --radius: 6px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            padding: 32px 20px 80px;
        }

        .header {
            margin-bottom: 32px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }
        .header .meta {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        /* Mode Toggle */
        .mode-toggle {
            display: flex;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            flex-shrink: 0;
        }
        .mode-toggle button {
            padding: 8px 16px;
            border: none;
            background: var(--surface);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.15s;
            white-space: nowrap;
        }
        .mode-toggle button:first-child {
            border-right: 1px solid var(--border);
        }
        .mode-toggle button.active-mode {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 32px;
        }
        .stat {
            text-align: center;
            padding: 16px 8px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
        }
        .stat .value {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .stat .label {
            font-size: 0.65rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }

        .pie-section {
            text-align: center;
            margin-bottom: 36px;
        }
        .pie-section canvas {
            display: block;
            margin: 0 auto;
        }
        .pie-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        .week-nav {
            display: flex;
            gap: 0;
            margin-bottom: 28px;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            flex-wrap: wrap;
        }
        .week-nav button {
            flex: 1;
            padding: 10px 4px;
            border: none;
            background: var(--surface);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-muted);
            letter-spacing: 0.2px;
            transition: all 0.15s;
            border-right: 1px solid var(--border);
            min-width: 40px;
        }
        .week-nav button:last-child {
            border-right: none;
        }
        .week-nav button.active {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
        }
        .week-nav button.completed-nav {
            color: var(--green);
        }
        .week-nav button.completed-nav.active {
            background: var(--green);
            color: #fff;
        }

        .day-content {
            display: none;
            animation: fadeIn 0.25s ease;
        }
        .day-content.active {
            display: block;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(4px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .day-content h2 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 4px;
            letter-spacing: -0.2px;
        }
        .day-content .day-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }
        .day-content .day-badge {
            display: inline-block;
            font-size: 0.6rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 2px 8px;
            border-radius: 20px;
            margin-bottom: 16px;
        }
        .badge-home {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .badge-gym {
            background: #e3f2fd;
            color: #1565c0;
        }

        .ex-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
            transition: background 0.15s;
            flex-wrap: wrap;
        }
        .ex-row:last-child {
            border-bottom: none;
        }
        .ex-row.done {
            opacity: 0.5;
        }
        .ex-row.done .ex-name {
            text-decoration: line-through;
        }

        .ex-check {
            flex-shrink: 0;
            width: 22px;
            height: 22px;
            border: 1.5px solid #ccc;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            font-size: 12px;
            color: transparent;
            background: #fff;
        }
        .ex-check.checked {
            background: var(--green);
            border-color: var(--green);
            color: #fff;
        }
        .ex-check:hover {
            border-color: #888;
        }

        .ex-info {
            flex: 1;
            min-width: 120px;
        }
        .ex-name {
            font-size: 0.85rem;
            font-weight: 500;
        }
        .ex-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .ex-inputs {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .ex-inputs input {
            width: 52px;
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.75rem;
            text-align: center;
            background: #fff;
            color: var(--text);
        }
        .ex-inputs input:focus {
            outline: none;
            border-color: #888;
        }
        .ex-inputs .notes-inp {
            width: 100px;
            text-align: left;
        }

        .ex-video {
            flex-shrink: 0;
            font-size: 0.7rem;
            color: var(--text-muted);
            text-decoration: none;
            border-bottom: 1px dotted #ccc;
            padding-bottom: 1px;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .ex-video:hover {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: var(--radius);
            font-size: 0.8rem;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 0.2px;
            transition: opacity 0.15s;
            margin-top: 20px;
        }
        .btn:hover {
            opacity: 0.8;
        }
        .btn-ghost {
            background: transparent;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
            margin-top: 16px;
        }
        .log-table th {
            text-align: left;
            padding: 8px 6px;
            border-bottom: 1.5px solid var(--border);
            font-weight: 500;
            color: var(--text-muted);
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }
        .log-table td {
            padding: 8px 6px;
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }
        .log-table input,
        .log-table select {
            width: 70px;
            padding: 6px;
            border: 1px solid var(--border);
            border-radius: 4px;
            font-size: 0.75rem;
            background: #fff;
            color: var(--text);
            text-align: center;
        }
        .log-table input:focus,
        .log-table select:focus {
            outline: none;
            border-color: #888;
        }

        @media (max-width: 500px) {
            .container {
                padding: 20px 14px 60px;
            }
            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .stat {
                padding: 12px 6px;
            }
            .stat .value {
                font-size: 1.3rem;
            }
            .ex-row {
                gap: 8px;
                padding: 12px 0;
            }
            .ex-inputs input {
                width: 42px;
                font-size: 0.7rem;
            }
            .ex-inputs .notes-inp {
                width: 70px;
            }
            .week-nav button {
                font-size: 0.6rem;
                padding: 8px 2px;
            }
            .mode-toggle button {
                padding: 6px 10px;
                font-size: 0.7rem;
            }
        }
    </style>
</head>

        // ═══════════ STATE ═══════════
        function loadState() {
            try {
                const s = localStorage.getItem('recompTrackerV4');
                if (s) return JSON.parse(s);
            } catch (e) {}
            return {
                mode: 'home', // 'home' or 'gym'
                completedDays: {}, // { 'home-monday': true, 'gym-tuesday': true }
                exData: {}, // { 'home-monday-0': { w, r, n, done } }
                weightLog: {},
                pullUpMax: 0,
                pullUpHistory: [],
                week: getWeekStr(),
            };
        }

        function saveState() { try { localStorage.setItem('recompTrackerV4', JSON.stringify(state)); } catch (e) {} }

        function getWeekStr() {
            const d = new Date();
            const s = new Date(d.getFullYear(), 0, 1);
            return d.getFullYear() + '-W' + Math.ceil(((d - s) / 86400000 + s.getDay() + 1) / 7);
        }

        let state = loadState();
        if (state.week !== getWeekStr()) {
            state.completedDays = {};
            state.exData = {};
            state.week = getWeekStr();
            saveState();
        }

        function getDayKey(day) {
            return state.mode + '-' + day;
        }

        function getExData(key) {
            return state.exData[key] || { w: '', r: '', n: '', done: false };
        }

        function currentMeta() { return state.mode === 'home' ? homeMeta : gymMeta; }

        function currentExercises() { return state.mode === 'home' ? homeExercises : gymExercises; }

        const weightExercises = [
            'DB Bench Press', 'Barbell Bench Press', 'Pull-Ups', 'Barbell Back Squat', 'Romanian Deadlift',
            'Hip Thrust', 'Seated DB Shoulder Press', 'Lat Pulldowns', 'Seated Cable Rows', 'Goblet Squat',
            'Dips', 'Single-Arm DB Row', 'Hammer Curls', 'Overhead Tricep Extension', 'Leg Press',
        ];

        // ═══════════ MODE TOGGLE ═══════════
        function setMode(mode) {
            state.mode = mode;
            saveState();
            document.querySelectorAll('.mode-toggle button').forEach(b => b.classList.remove('active-mode'));
            document.querySelector(`.mode-toggle button[data-mode="${mode}"]`).classList.add('active-mode');
            updateAll();
            navigateTo('monday');
        }

        document.getElementById('modeToggle').addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && e.target.dataset.mode) {
                setMode(e.target.dataset.mode);
            }
        });

        // ═══════════ RENDER ═══════════
        function renderDay(day) {
            const container = document.getElementById('dayContainer');
            if (day === 'weights') { renderWeightLogTab(container); return; }
            if (day === 'diet') { renderDietTab(container); return; }

            const meta = currentMeta()[day];
            const exList = currentExercises()[day];
            const modeLabel = state.mode === 'home' ? 'Home Gym' : 'In-Gym';
            const badgeClass = state.mode === 'home' ? 'badge-home' : 'badge-gym';
            const dayKey = getDayKey(day);

            let html = `
            <div class="day-content active" id="day-${day}">
              <h2>${meta.title}</h2>
              <p class="day-sub">${meta.sub}</p>
              <span class="day-badge ${badgeClass}">${modeLabel}</span>
              <div class="ex-list" id="list-${day}">`;
            exList.forEach((ex, i) => {
                const key = dayKey + '-' + i;
                const d = getExData(key);
                html += `
            <div class="ex-row ${d.done ? 'done' : ''}" id="row-${key}">
              <div class="ex-check ${d.done ? 'checked' : ''}" data-key="${key}">${d.done ? '✓' : ''}</div>
              <div class="ex-info">
                <div class="ex-name">${ex.name}</div>
                <div class="ex-meta">${ex.sets} sets · ${ex.reps} reps</div>
              </div>
              <div class="ex-inputs">
                <input type="number" value="${d.w}" data-key="${key}" data-field="w" placeholder="lbs" min="0">
                <input type="number" value="${d.r}" data-key="${key}" data-field="r" placeholder="reps" min="0">
                <input type="text" value="${d.n}" data-key="${key}" data-field="n" class="notes-inp" placeholder="note">
              </div>
              <a href="${ex.vid}" target="_blank" rel="noopener" class="ex-video">form →</a>
            </div>`;
            });
            const isComplete = state.completedDays[dayKey];
            html += `</div>
            <button class="btn" id="btn-${day}">${isComplete ? '✓ Completed' : 'Mark Complete'}</button>
          </div>`;
            container.innerHTML = html;

            const list = document.getElementById('list-' + day);
            list.querySelectorAll('.ex-check').forEach(cb => {
                cb.addEventListener('click', function() { toggleEx(this.dataset.key); });
            });
            list.querySelectorAll('input').forEach(inp => {
                inp.addEventListener('change', function() {
                    updateExData(this.dataset.key, this.dataset.field, this.value);
                });
            });
            document.getElementById('btn-' + day).addEventListener('click', function() { markDay(day); });
        }

        function renderWeightLogTab(container) {
            let html = `
            <div class="day-content active" id="day-weights">
              <h2>Weight Log</h2>
              <p class="day-sub">Track your lifts & personal records</p>
              <table class="log-table">
                <thead><tr><th>Exercise</th><th>Best</th><th>Reps</th><th>Today wt</th><th>Today reps</th><th>Note</th></tr></thead>
                <tbody id="wl-body">`;
            weightExercises.forEach(ex => {
                const log = state.weightLog[ex] || { bw: 0, br: 0, tw: '', tr: '', n: '' };
                html += `<tr>
              <td>${ex}</td>
              <td>${log.bw || '—'}</td>
              <td>${log.br || '—'}</td>
              <td><input type="number" value="${log.tw}" data-ex="${ex}" class="wl-tw" placeholder="lbs" min="0"></td>
              <td><input type="number" value="${log.tr}" data-ex="${ex}" class="wl-tr" placeholder="reps" min="0"></td>
              <td><input type="text" value="${log.n}" data-ex="${ex}" class="wl-note" placeholder="—"></td>
            </tr>`;
            });
            html += `</tbody></table>
            <button class="btn" id="btn-save-wl">Save Weights</button>
            <br><br>
            <h2>Pull-Up Log</h2>
            <table class="log-table">
              <thead><tr><th>Date</th><th>Method</th><th>Sets × Reps</th><th>Note</th></tr></thead>
              <tbody>
                <tr>
                  <td><input type="date" id="pu-date"></td>
                  <td><select id="pu-method"><option>Negatives</option><option>Band-Assisted</option><option>Isometric</option><option>Full Pull-Ups</option></select></td>
                  <td><input type="text" id="pu-sr" placeholder="4×3" style="width:80px;"></td>
                  <td><input type="text" id="pu-note" placeholder="—" style="width:120px;"></td>
                </tr>
              </tbody>
            </table>
            <button class="btn btn-ghost" id="btn-pu-log" style="margin-top:8px;">+ Log Pull-Up</button>
            <div id="pu-history" style="margin-top:12px;font-size:0.75rem;color:var(--text-muted);"></div>
          </div>`;
            container.innerHTML = html;

            document.querySelectorAll('.wl-tw').forEach(inp => {
                inp.addEventListener('change', function() {
                    const ex = this.dataset.ex;
                    if (!state.weightLog[ex]) state.weightLog[ex] = { bw: 0, br: 0, tw: '', tr: '', n: '' };
                    state.weightLog[ex].tw = this.value;
                    saveState();
                });
            });
            document.querySelectorAll('.wl-tr').forEach(inp => {
                inp.addEventListener('change', function() {
                    const ex = this.dataset.ex;
                    if (!state.weightLog[ex]) state.weightLog[ex] = { bw: 0, br: 0, tw: '', tr: '', n: '' };
                    state.weightLog[ex].tr = this.value;
                    saveState();
                });
            });
            document.querySelectorAll('.wl-note').forEach(inp => {
                inp.addEventListener('change', function() {
                    const ex = this.dataset.ex;
                    if (!state.weightLog[ex]) state.weightLog[ex] = { bw: 0, br: 0, tw: '', tr: '', n: '' };
                    state.weightLog[ex].n = this.value;
                    saveState();
                });
            });
            document.getElementById('btn-save-wl').addEventListener('click', saveWeightLog);
            document.getElementById('btn-pu-log').addEventListener('click', logPullUp);
            renderPullUpHistory();
        }

        function renderDietTab(container) {
            const weightLbs = 180;
            const weightKg = weightLbs / 2.205;
            const heightCm = 172.7;
            const age = 25;
            const bmr = 10 * weightKg + 6.25 * heightCm - 5 * age + 5;
            const tdee = Math.round(bmr * 1.55);
            const targetCals = Math.round(tdee * 0.95);
            const proteinG = Math.round(weightLbs * 1.0);
            const fatG = Math.round(weightLbs * 0.4);
            const proteinCals = proteinG * 4;
            const fatCals = fatG * 9;
            const carbCals = targetCals - proteinCals - fatCals;
            const carbG = Math.round(carbCals / 4);
            const fiberG = 30;

            let html = `
            <div class="day-content active" id="day-diet">
              <h2>Daily Nutrition Targets</h2>
              <p class="day-sub">For body recomposition at 5'8" · 180 lbs</p>
              <div class="stats" style="margin-bottom:20px;">
                <div class="stat"><div class="value">${targetCals}</div><div class="label">Calories</div></div>
                <div class="stat"><div class="value">${proteinG}g</div><div class="label">Protein</div></div>
                <div class="stat"><div class="value">${carbG}g</div><div class="label">Carbs</div></div>
                <div class="stat"><div class="value">${fatG}g</div><div class="label">Fat</div></div>
              </div>
              <table class="log-table" style="margin-top:10px;">
                <thead><tr><th>Nutrient</th><th>Target</th><th>Notes</th></tr></thead>
                <tbody>
                  <tr><td>Calories</td><td>~${targetCals} kcal</td><td>Slight deficit from maintenance (~${tdee})</td></tr>
                  <tr><td>Protein</td><td>${proteinG}g</td><td>1g per lb body weight — prioritise this</td></tr>
                  <tr><td>Carbohydrates</td><td>${carbG}g</td><td>Fill remaining calories; focus around workouts</td></tr>
                  <tr><td>Fat</td><td>${fatG}g</td><td>~0.4g per lb; healthy sources</td></tr>
                  <tr><td>Fiber</td><td>${fiberG}g+</td><td>Vegetables, whole grains, legumes</td></tr>
                  <tr><td>Water</td><td>3–4 L</td><td>Stay hydrated; more on training days</td></tr>
                </tbody>
              </table>
            </div>`;
            container.innerHTML = html;
        }

        // ═══════════ ACTIONS ═══════════
        function toggleEx(key) {
            if (!state.exData[key]) state.exData[key] = { w: '', r: '', n: '', done: false };
            state.exData[key].done = !state.exData[key].done;
            saveState();
            const row = document.getElementById('row-' + key);
            const check = row ? row.querySelector('.ex-check') : null;
            if (row) row.classList.toggle('done', state.exData[key].done);
            if (check) {
                check.classList.toggle('checked', state.exData[key].done);
                check.textContent = state.exData[key].done ? '✓' : '';
            }
            updateAll();
        }

        function updateExData(key, field, value) {
            if (!state.exData[key]) state.exData[key] = { w: '', r: '', n: '', done: false };
            state.exData[key][field] = value;
            saveState();
            updateAll();
        }

        function markDay(day) {
            const dayKey = getDayKey(day);
            const exList = currentExercises()[day];
            const allDone = exList.every((_, i) => {
                const d = state.exData[dayKey + '-' + i];
                return d && d.done;
            });
            if (!allDone && !state.completedDays[dayKey]) {
                if (!confirm('Not all exercises checked. Mark complete anyway?')) return;
            }
            state.completedDays[dayKey] = !state.completedDays[dayKey];
            saveState();
            updateAll();
            renderDay(day);
            updateNavActive(day);
        }

        function saveWeightLog() {
            weightExercises.forEach(ex => {
                const log = state.weightLog[ex] || { bw: 0, br: 0, tw: '', tr: '', n: '' };
                const tw = parseFloat(log.tw) || 0;
                const tr = parseFloat(log.tr) || 0;
                if (tw > 0 && tr > 0) {
                    if (tw > log.bw || (tw === log.bw && tr > log.br)) {
                        log.bw = tw;
                        log.br = tr;
                    }
                }
                log.tw = '';
                log.tr = '';
                log.n = '';
                state.weightLog[ex] = log;
            });
            saveState();
            alert('Weights saved.');
            renderDay('weights');
        }

        function logPullUp() {
            const date = document.getElementById('pu-date').value || new Date().toISOString().slice(0, 10);
            const method = document.getElementById('pu-method').value;
            const sr = document.getElementById('pu-sr').value;
            const note = document.getElementById('pu-note').value;
            if (!sr) return alert('Enter sets × reps.');
            state.pullUpHistory.unshift({ date, method, sr, note });
            if (method === 'Full Pull-Ups') {
                const m = sr.match(/(\d+)×(\d+)/);
                if (m && parseInt(m[2]) > state.pullUpMax) state.pullUpMax = parseInt(m[2]);
            }
            saveState();
            document.getElementById('pu-sr').value = '';
            document.getElementById('pu-note').value = '';
            renderPullUpHistory();
            updateAll();
            alert('Pull-up logged.');
        }

        function renderPullUpHistory() {
            const el = document.getElementById('pu-history');
            if (!el) return;
            if (state.pullUpHistory.length === 0) { el.innerHTML = '<p>No entries yet.</p>'; return; }
            let h = '<table class="log-table"><thead><tr><th>Date</th><th>Method</th><th>Sets×Reps</th><th>Note</th></tr></thead><tbody>';
            state.pullUpHistory.slice(0, 15).forEach(e => {
                h += `<tr><td>${e.date}</td><td>${e.method}</td><td>${e.sr}</td><td>${e.note || '—'}</td></tr>`;
            });
            h += '</tbody></table>';
            el.innerHTML = h;
        }

        function updateAll() {
            const completed = weekDays.filter(d => state.completedDays[getDayKey(d)]).length;
            document.getElementById('sessionsCompleted').textContent = completed;
            document.getElementById('pullUpMax').textContent = state.pullUpMax || 0;

            let streak = 0;
            const today = new Date().getDay();
            const map = { 1: 'monday', 2: 'tuesday', 3: 'wednesday', 4: 'thursday', 5: 'friday' };
            for (let i = today; i >= 1; i--) {
                if (map[i] && state.completedDays[getDayKey(map[i])]) streak++;
                else if (map[i]) break;
            }
            document.getElementById('streakDays').textContent = streak;

            let tw = 0;
            Object.values(state.exData).forEach(d => { if (d.w && d.r && d.done) tw += parseFloat(d.w) * parseFloat(d.r); });
            document.getElementById('totalWeight').textContent = Math.round(tw).toLocaleString();

            drawPie();
            updateNavBadges();
        }

        function drawPie() {
            const canvas = document.getElementById('pieCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const total = 5;
            const done = weekDays.filter(d => state.completedDays[getDayKey(d)]).length;
            ctx.clearRect(0, 0, 100, 100);
            const cx = 50, cy = 50, r = 40;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fillStyle = '#eee';
            ctx.fill();
            if (done > 0) {
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + (done / total) * Math.PI * 2);
                ctx.fillStyle = '#2e7d32';
                ctx.fill();
            }
            ctx.beginPath();
            ctx.arc(cx, cy, r * 0.5, 0, Math.PI * 2);
            ctx.fillStyle = '#fafafa';
            ctx.fill();
            ctx.fillStyle = '#1a1a1a';
            ctx.font = 'bold 16px -apple-system, sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`${done}/${total}`, cx, cy);
        }

        function updateNavBadges() {
            document.querySelectorAll('.week-nav button[data-day]').forEach(btn => {
                const day = btn.dataset.day;
                if (weekDays.includes(day)) {
                    btn.classList.toggle('completed-nav', !!state.completedDays[getDayKey(day)]);
                }
            });
        }

        function updateNavActive(activeDay) {
            document.querySelectorAll('.week-nav button').forEach(b => b.classList.remove('active'));
            const btn = document.querySelector(`.week-nav button[data-day="${activeDay}"]`);
            if (btn) btn.classList.add('active');
        }

        let currentTab = 'monday';
        function navigateTo(day) {
            currentTab = day;
            updateNavActive(day);
            renderDay(day);
            updateAll();
        }

        document.getElementById('weekNav').addEventListener('click', function(e) {
            if (e.target.tagName === 'BUTTON' && e.target.dataset.day) {
                navigateTo(e.target.dataset.day);
            }
        });

        function init() {
            document.querySelector(`.mode-toggle button[data-mode="${state.mode}"]`).classList.add('active-mode');
            navigateTo('monday');
            updateAll();
        }
        init();
    </script>
</body>
</html>
